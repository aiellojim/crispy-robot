<title>Favicon options</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 28px; background:#F5F5F5; }
  h2 { font-size: 15px; margin: 0 0 4px; color:#111; }
  .sub { font-size: 12px; color: #888; margin: 0 0 20px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 260px; }
  .label { font-size: 12px; font-weight:600; color:#444; margin-bottom:10px; }

  .tab img { width:16px; height:16px; flex-shrink:0; }
  .tab span { font-size:12px; color:#333; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .browserbar { background:#fff; border:1px solid #ddd; border-radius:0 8px 8px 8px; padding:16px; max-width:220px; margin-bottom:20px; }
  .big { display:flex; align-items:center; gap:16px; margin-top:8px; }
  .big img { width:48px; height:48px; border-radius:11px; }
  .swatch { width:64px; height:64px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .swatch img { width:36px; height:36px; }
</style>
